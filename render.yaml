services:
  - type: web
    name: fish-landing-duqm
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: fish-landing-data
      mountPath: /var/data
      sizeGB: 1
